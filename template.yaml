# -----------------------------------------------------------------------------
# This is an AWS Serverless Application Model (SAM) template
# It defines the "stack" of AWS resources needed to run the SAM app
# -----------------------------------------------------------------------------
AWSTemplateFormatVersion: 2010-09-09

# -----------------------------------------------------------------------------
# This file is written in SAM syntax, and gets transfomed and expanded into a
# CloudFormation template.  The CloudFormation template is what actually gets
# deployed.  The main point is that SAM syntax is much simpler, with a lot less
# boilerplate around declaring resources like Lambda functions and their
# accompanying execution roles.
# -----------------------------------------------------------------------------
Transform: AWS::Serverless-2016-10-31

# -----------------------------------------------------------------------------
# This particular template defines website hosting for the Tacocat photo gallery
# -----------------------------------------------------------------------------
Description: Tacocat gallery static SPA website hosting

# -----------------------------------------------------------------------------
# Parameters that can be specified when deploying this stack
# -----------------------------------------------------------------------------
Parameters:
  GalleryAppDomain:
    Description: Domain of the Tacocat photo gallery web app 
    Type: String
    AllowedValues:
      - staging-pix.tacocat.com
      - pix.tacocat.com
  DomainCertificateArn:
    Description: ARN of the ACM certificate for the GalleryAppDomain domain
    Type: String
    AllowedValues:
      - arn:aws:acm:us-east-1:010410881828:certificate/092ab57c-f87d-4c44-a72c-63cfbbb55800 # staging-pix.tacocat.com
      - arn:aws:acm:us-east-1:010410881828:certificate/e142cda0-96db-4651-92fd-35dd9a52e9a2 # pix.tacocat.com

# -----------------------------------------------------------------------------
# Conditions
# -----------------------------------------------------------------------------
Conditions:
  IsProd: !Equals [ !Ref GalleryAppDomain, "pix.tacocat.com" ]

# -----------------------------------------------------------------------------
# Resources are the actual assets that will be provisioned on AWS
# -----------------------------------------------------------------------------
Resources:

  # Serves /robots.txt. From a function, not an S3 file, so the SPA's
  # 404-to-index.html rewrite can't hand crawlers HTML to parse as directives.
  RobotsTxtFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-robots-txt-handler
      AutoPublish: true
      # Must be inline; CloudFormation can't reference an external file.
      FunctionCode: |
        // Blocked by name because they only train, so there's no listing to
        // lose. Google-Extended and Applebot-Extended govern training alone --
        // Googlebot and Applebot still crawl, and indexing is unaffected.
        // Sorted, so a duplicate is visible on sight. Curated rather than
        // exhaustive: published lists run to 60+ but carry dead operators and
        // library UAs like Scrapy, which no one sets honestly.
        // The -User and -SearchBot agents are retrieval, not training. Blocking
        // them contradicts the allow-so-noindex-is-seen logic above, and it is
        // deliberate: unlike Google these have no de-indexing pathway to
        // preserve, so there is no listing to protect by letting them in.
        var AI_TRAINING_BOTS = [
          'AI2Bot',
          'Amazonbot',
          'anthropic-ai',
          'Applebot-Extended',
          'Bytespider',
          'CCBot',
          'ChatGPT-User',
          'Claude-SearchBot',
          'Claude-User',
          'Claude-Web',
          'ClaudeBot',
          'cohere-ai',
          'Diffbot',
          'DuckAssistBot',
          'FacebookBot',
          'Google-CloudVertexBot',
          'Google-Extended',
          'GPTBot',
          'ImagesiftBot',
          'img2dataset',
          'Meta-ExternalAgent',
          'meta-externalfetcher',
          'MistralAI-User',
          'OAI-SearchBot',
          'omgili',
          'omgilibot',
          'PanguBot',
          'Perplexity-User',
          'PerplexityBot',
          'SemrushBot-OCOB',
          'Timpibot',
          'Webzio-Extended',
          'YouBot'
        ];

        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri === '/robots.txt') {
            // Crawling is allowed in order to stay OUT of search results: a
            // crawler must fetch a page to see its noindex. A Disallow here
            // would hide the noindex and leave bare URLs listed instead.
            // No Crawl-delay -- Google ignores it, and slowing the crawlers
            // that honor it would only delay de-indexing.
            var body = 'User-agent: *\nAllow: /\n\n';
            for (var i = 0; i < AI_TRAINING_BOTS.length; i++) {
              body += 'User-agent: ' + AI_TRAINING_BOTS[i] + '\n';
            }
            body += 'Disallow: /\n';

            return {
              statusCode: 200,
              statusDescription: 'OK',
              headers: {
                'content-type': { value: 'text/plain; charset=utf-8' }
              },
              body: {
                encoding: 'text',
                data: body
              }
            };
          }

          return request;
        }
      FunctionConfig:
        Comment: "Serves robots.txt; crawling allowed so the noindex is seen"
        Runtime: cloudfront-js-2.0

  # -----------------------------------------------------------------------------
  # S3 bucket to host single page app (SPA) website
  # -----------------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-bucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: Delete Old Versions
            NoncurrentVersionExpirationInDays: 7 # delete old versions after a week
            ExpiredObjectDeleteMarker: true
            Status: Enabled
  
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Id: PolicyForCloudFrontPrivateContent
        Statement:
        - Sid: AllowCloudFrontServicePrincipal
          Effect: "Allow"
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource: !Sub arn:aws:s3:::${WebsiteBucket}/*
          Condition:
            StringEquals:
              "AWS:SourceArn": !Join [ "", [ "arn:aws:cloudfront::", !Ref "AWS::AccountId", ":distribution/", !Ref CloudFrontDistribution ] ]
  
  # -----------------------------------------------------------------------------
  # S3 bucket for CloudFront access logs (standard logging v2, delivered by
  # CloudWatch Logs). No ACLs: S3's default bucket-owner-enforced setting accepts
  # the bucket-owner-full-control header that log delivery sends.
  # -----------------------------------------------------------------------------
  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      BucketName: !Sub ${AWS::StackName}-cloudfront-logs
      LifecycleConfiguration:
        Rules:
          - Id: Expire Old Logs
            ExpirationInDays: 90
            Status: Enabled

  CloudFrontLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSLogsDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${CloudFrontLogsBucket.Arn}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*

  # -----------------------------------------------------------------------------
  # CloudFront Distribution for hosting the single page app website
  # -----------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Static SPA website files for ${AWS::StackName}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Aliases:
        - !Ref GalleryAppDomain
        ViewerCertificate:
          AcmCertificateArn: !Ref DomainCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # These custom error responses are needed to support single page apps
        # When a user requests a path that doesn't physically exist such as
        # /2001/12-31/, S3 will return a 404 (actually a 403).  This tells 
        # CloudFront to return index.html instead of that error.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
        - Id: S3Origin
          DomainName: !GetAtt WebsiteBucket.RegionalDomainName
          OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          S3OriginConfig:
            OriginAccessIdentity: ""
        CacheBehaviors:
          - PathPattern: /_app/immutable/*
            TargetOriginId: S3Origin
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref ImmutableCachePolicy
            ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
          - PathPattern: "/robots.txt"
            TargetOriginId: S3Origin
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RobotsTxtFunction.FunctionMetadata.FunctionARN
            # Shares the default policy. The crawler directives say nothing on
            # a directives file, but HSTS and nosniff apply to any response,
            # and this behavior is otherwise the one path serving neither.
            ResponseHeadersPolicyId: !Ref DefaultResponseHeadersPolicy
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          Compress: true
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
          ResponseHeadersPolicyId: !Ref DefaultResponseHeadersPolicy
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-origin-access-control
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # CloudFront standard logging (v2) for the SPA distribution -> S3.
  # Three CloudWatch Logs resources: source (the distribution), destination
  # (the bucket), and the delivery that pairs them. Must live in us-east-1.
  # Enabled in every environment so the wiring is proven in staging before prod.
  # ---------------------------------------------------------------------------
  SpaLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub ${AWS::StackName}-spa-cdn
      LogType: ACCESS_LOGS
      ResourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  SpaLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub ${AWS::StackName}-spa-cdn-s3
      DestinationResourceArn: !GetAtt CloudFrontLogsBucket.Arn
      OutputFormat: w3c # tab-separated with a #Fields header; cannot be changed without replacing this resource

  SpaLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn:
      - SpaLogDeliverySource
      - CloudFrontLogsBucketPolicy
    Properties:
      DeliverySourceName: !Sub ${AWS::StackName}-spa-cdn # must equal SpaLogDeliverySource.Name
      DeliveryDestinationArn: !GetAtt SpaLogDeliveryDestination.Arn
      S3SuffixPath: spa/{yyyy}/{MM}/{dd}/
      # Naming RecordFields at all means listing every field wanted; there is no
      # add-to-the-default form. This is CloudFront's default minus cs(Cookie),
      # x-forwarded-for, fle-* and sc-range-*, which this distribution cannot
      # populate, plus asn and c-country. Order sets the column order in S3.
      RecordFields:
        - date
        - time
        - x-edge-location
        - sc-bytes
        - c-ip
        - cs-method
        - cs(Host)
        - cs-uri-stem
        - sc-status
        - cs(Referer)
        - cs(User-Agent)
        - cs-uri-query
        - x-edge-result-type
        - x-edge-request-id
        - x-host-header
        - cs-protocol
        - cs-bytes
        - time-taken
        - ssl-protocol
        - ssl-cipher
        - x-edge-response-result-type
        - cs-protocol-version
        - c-port
        - time-to-first-byte
        - x-edge-detailed-result-type
        - sc-content-type
        - sc-content-len
        - asn
        - c-country

  # The default behavior's headers: crawler opt-out plus browser security.
  # A behavior gets exactly one policy, so both concerns live here rather
  # than in a policy each. The crawler half is a request that a crawler may
  # ignore; the security half is enforced by the browser.
  DefaultResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub DefaultResponseHeadersPolicy-${AWS::StackName}
        Comment: !Sub Crawler opt-out and security headers for ${AWS::StackName}
        SecurityHeadersConfig:
          # includeSubDomains binds img./api./auth. under this domain. Verified
          # all three serve HTTPS with a valid cert in both environments before
          # enabling. Note it binds future subdomains too, so a new one has to
          # be HTTPS from its first day.
          # Preload is deliberately off: entering the browsers' preload list is
          # the one step here that cannot be walked back on our own timetable.
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000 # 1 year
            IncludeSubdomains: true
            Preload: false
            Override: true
          # Emits X-Content-Type-Options: nosniff.
          ContentTypeOptions:
            Override: true
          # Matches what browsers already default to, so it changes nothing
          # observable today; it pins the behavior against a default changing.
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # DENY rather than SAMEORIGIN: the SPA contains no iframes, so there
          # is nothing to lose, and framing the gallery elsewhere is the one
          # form of reuse a browser will actually block for us.
          FrameOptions:
            FrameOption: DENY
            Override: true
        CustomHeadersConfig:
          Items:
            # Not available in SecurityHeadersConfig, so it goes here. Omits
            # autoplay (the gallery plays video) and fullscreen (a gallery is
            # the sort of thing that grows a fullscreen viewer).
            - Header: Permissions-Policy
              Value: accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
              Override: true
            # Duplicates the SPA's noindex meta tag, and reaches what markup
            # can't: non-HTML responses, and crawlers that skip the body.
            # No nofollow: crawlers reach deep routes by following links, and
            # that is how the noindex gets delivered to pages already indexed.
            # noimageindex is the one that covers the photos -- Google ties an
            # image to the page embedding it, so this reaches img.pix even
            # though that distribution lives in another repo.
            # nosnippet/max-image-preview/notranslate suppress what is shown
            # in the weeks before a recrawl actually drops the page.
            # noarchive is historical at Google but may still serve Bing.
            # noai/noimageai are a DeviantArt-origin convention, absent from
            # Google's documented directives. Kept because they cost nothing,
            # not because any crawler is known to honor them.
            - Header: X-Robots-Tag
              Value: noindex, noimageindex, nosnippet, max-image-preview:none, notranslate, noarchive, noai, noimageai
              Override: true
            # W3C TDMRep, 1 = rights reserved. Legal rather than technical: EU
            # DSM Article 4 permits commercial text/data mining unless reserved
            # "by machine-readable means". This is that reservation.
            - Header: tdm-reservation
              Value: "1"
              Override: true

  # Set Cache-Control header to cache forever
  ImmutableResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties: 
      ResponseHeadersPolicyConfig: 
        Name: !Sub ImmutableResponseHeadersPolicy-${AWS::StackName}
        Comment: !Sub Immutable response headers policy for ${AWS::StackName}
        # Repeated from the default policy because a behavior gets one policy
        # and these bundles get their own. Only the two that mean something on
        # a subresource: HSTS applies to the host however it arrives, and
        # nosniff matters most on exactly these files. Frame, referrer and
        # permissions rules are per-document and would say nothing here.
        # max-age must match the default policy's; test 7 fails if it drifts.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000 # 1 year
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=31536000, immutable
              Override: true
            # A behavior gets one policy, so this repeats the robots directive
            # rather than inheriting it. Deliberately shorter than the default
            # behavior's: the image and snippet rules mean nothing on a JS or
            # CSS bundle, so there is no shared value to drift.
            - Header: X-Robots-Tag
              Value: noindex
              Override: true

  # Caching policy to cache forever
  ImmutableCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ImmutableCachePolicy-${AWS::StackName}
        Comment: Cache for a year
        DefaultTTL: 31536000 # 1 year
        MaxTTL: 31536000 # 1 year
        MinTTL: 31536000 # 1 year
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none


# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID for hosting web front end
    Value: !Ref CloudFrontDistribution
  CloudFrontDistributionDomainName:
    Description: CloudFront Distribution Domain Name for accessing web front end
    Value: !GetAtt CloudFrontDistribution.DomainName
  WebS3BucketName:
    Description: S3 Bucket for hosting web site
    Value: !Ref WebsiteBucket
  CloudFrontLogsBucketName:
    Description: S3 Bucket receiving CloudFront access logs for the web front end
    Value: !Ref CloudFrontLogsBucket
