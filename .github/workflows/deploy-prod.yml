name: Deploy to Production

on:
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-validate:
        uses: ./.github/workflows/build-and-validate.yml
        permissions:
            contents: read
            id-token: write # a called workflow can hold at most the permissions the caller grants

    deploy:
        needs: build-and-validate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # The prod environment requires a reviewer's approval before this job starts and only
        # runs from a protected branch. The prod AWS role trusts jobs in this environment alone.
        environment:
            name: prod
            url: https://pix.tacocat.com
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::010410881828:role/tacocat-gallery-website-hosting-cicd-github-prod
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Deploy to production
              run: sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset

    test:
        needs: deploy
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Run integration tests
              run: ./scripts/integration-tests.sh pix.tacocat.com

    create-release:
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Create release tag
              id: tag
              run: |
                  set -e
                  year=$(date +%Y)
                  latest_tag=$(git tag -l "${year}v*" | sort -V | tail -n1)
                  if [ -z "$latest_tag" ]; then
                      new_tag="${year}v1"
                  else
                      version_num=${latest_tag#"${year}"v}
                      new_version=$((version_num + 1))
                      new_tag="${year}v${new_version}"
                  fi
                  echo "Creating tag: $new_tag"
                  echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "$new_tag" -m "Production release $new_tag"
                  git push origin "$new_tag"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
