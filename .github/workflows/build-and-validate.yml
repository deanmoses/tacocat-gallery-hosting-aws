name: Build and Validate

on:
    workflow_call:

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            # Pinned and checksum-verified rather than installed from a script
            # piped to a shell, since this runs with the repo checked out.
            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  set -euo pipefail
                  curl -fsSL -o actionlint.tar.gz \
                    "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
                  tar -xzf actionlint.tar.gz actionlint
                  sudo install -m 0755 actionlint /usr/local/bin/actionlint
                  rm -f actionlint.tar.gz actionlint

            # The same script .husky/pre-commit runs, so the two cannot drift.
            # Covers cfn-lint, the inline CloudFront Function's JS, shell
            # scripts and the workflows themselves. CI sets CI=true, which makes
            # a missing linter a failure here rather than a silent skip.
            - name: Lint
              run: ./scripts/lint.sh

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Validate changeset (dry-run)
              run: |
                  set -o pipefail
                  sam deploy --no-execute-changeset --no-fail-on-empty-changeset 2>&1 | tee /tmp/changeset.log
                  if grep -q "Failed to create changeset" /tmp/changeset.log; then
                    echo "::error::Changeset validation failed"
                    exit 1
                  fi
